# Manual release. The only way this repository releases.
#
#   gh workflow run release.yml -R EduIDE/EduIDE-Helm -f version=2.11.0
#
# Both charts (eduide, eduide-cluster) ship under the same version. See
# .claude/skills/release/SKILL.md for the whole flow.
#
# A Release created with GITHUB_TOKEN starts no other workflow, so everything
# a release needs is a job in this file.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version without the leading v, e.g. 2.11.0, or 2.11.0-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Before the tag exists: every image the charts pin is there, and the chart
  # versions are free.
  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      ide: ${{ steps.pins.outputs.ide }}
      cloud: ${{ steps.pins.outputs.cloud }}
      landing: ${{ steps.pins.outputs.landing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$OWNER" --password-stdin

      # A chart version is a promise about images: appVersion pins every IDE
      # image, versions.cloud the operator and service, versions.landingPage the
      # landing page. Publishing a chart that names a tag nobody pushed produces
      # an ImagePullBackOff in whichever environment installs it next, which is
      # the slowest possible place to find out. Check first, publish second.
      - name: Install crane and yq
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
          echo '${{ secrets.GITHUB_TOKEN }}' | crane auth login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Every image the chart pins exists
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          ide=$(yq -r '.appVersion' charts/eduide/Chart.yaml)
          cloud=$(yq -r '.versions.cloud' charts/eduide/values.yaml)
          landing=$(yq -r '.versions.landingPage' charts/eduide/values.yaml)

          # The IDE image list is read from EduIDE's build matrix rather than
          # kept here: a hand-written copy drifts the moment someone adds an
          # image, and then a release verifies a subset and passes.
          #
          # At the pinned tag, not the default branch. A later EduIDE release
          # that adds an image would otherwise make a chart-only release demand
          # that image at this chart's older appVersion, where it was never
          # built. Falling back to the default branch keeps this working for an
          # appVersion that has no tag yet, such as a pre-release.
          if ! gh api "repos/EduIDE/EduIDE/contents/.github/workflows/build.yml?ref=v${ide}" --jq '.content' 2>/dev/null | base64 -d > /tmp/build.yml; then
            echo "::notice::no v${ide} tag in EduIDE; reading the build matrix from its default branch"
            gh api repos/EduIDE/EduIDE/contents/.github/workflows/build.yml --jq '.content' | base64 -d > /tmp/build.yml
          fi
          ide_images=$(yq -r '[.jobs.images.strategy.matrix.include[]["image-name"]] | .[]' /tmp/build.yml | sed 's|^eduide/||')
          ide_base=$(yq -r '.jobs.base.with["image-name"]' /tmp/build.yml | sed 's|^eduide/||')
          if [[ -z "${ide_images// /}" || -z "$ide_base" || "$ide_base" == "null" ]]; then
            echo "::error::could not read EduIDE's build matrix; refusing to verify an incomplete image set"
            exit 1
          fi

          fail=0
          check() {
            local ref="$1" manifest arches
            if ! manifest=$(crane manifest "$ref" 2>/dev/null); then
              echo "::error::missing $ref"
              fail=1
              return
            fi
            arches=$(jq -r '[.manifests[]?.platform.architecture] | sort | join(",")' <<<"$manifest")
            if [[ "$arches" != *amd64* || "$arches" != *arm64* ]]; then
              echo "::error::$ref is not multi-arch (has: ${arches:-none})"
              fail=1
              return
            fi
            echo "  ok  $ref  [$arches]"
          }

          for img in $ide_base $ide_images; do check "ghcr.io/eduide/${img}:${ide}"; done
          for img in eduide-cloud/operator eduide-cloud/service eduide-cloud/conversion-webhook; do
            check "ghcr.io/eduide/${img}:${cloud}"
          done
          check "ghcr.io/eduide/eduide-landing-page:${landing}"

          {
            echo "ide=$ide"
            echo "cloud=$cloud"
            echo "landing=$landing"
          } >> "$GITHUB_OUTPUT"
          exit $fail

      # A published chart version is never replaced: helm push overwrites.
      - name: Chart versions are not published yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for chart in eduide eduide-cluster; do
            if helm show chart "oci://ghcr.io/eduide/charts/${chart}" --version "$VERSION" >/dev/null 2>&1; then
              echo "::error::${chart} ${VERSION} is already published. Pick the next version."
              exit 1
            fi
          done

  release:
    needs: pins
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"
      changelog_heading: "## [eduide {version}]"
      version_check: |
        for chart in eduide eduide-cluster; do
          got=$(yq -r .version "charts/${chart}/Chart.yaml")
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error file=charts/${chart}/Chart.yaml::version is '$got', expected '$VERSION'. Bump it in the release pull request first."
            exit 1
          fi
        done

  publish:
    needs: [pins, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GHCR
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$OWNER" --password-stdin

      # --version stamps a release candidate; for a stable release it equals
      # the version in Chart.yaml, which the release job already checked.
      - name: Package and push charts
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p dist
          for chart in eduide-cluster eduide; do
            ./scripts/resolve-deps.sh "charts/${chart}"
            helm package "charts/${chart}" --version "$VERSION" --destination dist
            helm push "dist/${chart}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
          done

      - name: Add the pinned versions to the release notes
        env:
          TAG: ${{ needs.release.outputs.tag }}
          IDE: ${{ needs.pins.outputs.ide }}
          CLOUD: ${{ needs.pins.outputs.cloud }}
          LANDING: ${{ needs.pins.outputs.landing }}
        run: |
          set -euo pipefail
          {
            gh release view "$TAG" --json body --jq .body
            echo
            echo "## What this chart version pins"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| IDE images (EduIDE) | ${IDE} |"
            echo "| Operator and service (EduIDE-Cloud) | ${CLOUD} |"
            echo "| Landing page | ${LANDING} |"
            echo
            echo "Charts published to \`oci://ghcr.io/eduide/charts\`: \`eduide\` and \`eduide-cluster\` at ${VERSION}."
            echo "Every image above was verified to exist and be multi-arch before the charts were pushed."
            echo
            echo "## Deploying it"
            echo
            echo "Bump \`spec.platform.chartVersion\` to \`${VERSION}\` in the relevant"
            echo "\`environments/*/env.yaml\` in EduIDE-deployment, in a pull request."
            echo "Merging records the version; only \`e2e\` deploys on merge. Every"
            echo "other environment, production included, needs Actions ->"
            echo "**Deploy environment** run against it. Nothing here rolls anything out."
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  verify:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GHCR
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$OWNER" --password-stdin

      - name: Charts and release exist
        run: |
          set -euo pipefail
          for chart in eduide eduide-cluster; do
            helm show chart "oci://ghcr.io/eduide/charts/${chart}" --version "$VERSION" | grep -x "version: ${VERSION}"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
          {
            echo "## Released ${TAG}"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
