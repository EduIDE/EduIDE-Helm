# EXPERIMENTAL: test deployment "test3" of the Go control plane on cluster stud, namespace eduide-test3.
# Install steps are in README.md. The image tags pr-<N> are placeholders the deployer sets.
# The anchors state hosts and gateway once for both subcharts.

x-hosts: &hosts
  service: test3.eduide.student.k8s.aet.cit.tum.de
  instance: instance.test3.eduide.student.k8s.aet.cit.tum.de
  webview: webview.instance.test3.eduide.student.k8s.aet.cit.tum.de

x-gateway: &gateway
  name: eduide
  namespace: eduide-test3
  # Empty: routes attach to every listener whose hostname matches their hostnames.
  sectionName: ""

x-keycloak: &keycloak
  url: https://keycloak-test.aet.cit.tum.de/
  realm: tum
  clientId: eduide

gateway:
  create: true
  className: envoy

# The ClusterIssuer letsencrypt-prod-gateway solves HTTP01 only through the shared Gateway, so this
# namespaced Issuer (same ACME server and account email) solves through the Gateway of this namespace.
issuer:
  create: true
  name: letsencrypt-prod-gateway
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin.aet@xcit.tum.de

images:
  registry: ghcr.io/eduide
  tag: pr-0 # set to the pr-<N> tag of the EduIDE-c-makefile PR that builds eduide-session

templates:
  java-17:
    pool: {minIdle: 1, maxInstances: 5}
  c: {}

eduide-control-plane:
  image:
    tag: pr-0 # set to the pr-<N> tag of the EduIDE-control-plane PR
  config:
    deployment: test3
    hosts: *hosts
    gateway: *gateway
    oidc:
      issuerURL: https://keycloak-test.aet.cit.tum.de/realms/tum
      clientIDs: [eduide]
      gatewayClientID: eduide
    allowedHosts:
    - github.com
    - gitlab.com
    - codeberg.org
    # Artemis test hosts: add the artemis-test*.artemis.cit.tum.de hosts in use.
    workspaces:
      storageClassName: csi-rbd-sc
    placement:
      nodeSelector:
        aet.cit.tum.de/pool: eduide
      nodePoolLabel: aet.cit.tum.de/pool
      # The eduide nodes of stud carry no taints, so no toleration is needed.
    telemetry:
      otlpEndpoint: jaeger-collector.eduide-test3:4317
  oidc:
    # Created separately, see README.md.
    clientSecretName: eduide-oidc

eduide-landing-page:
  image:
    tag: pr-0 # set to the pr-<N> tag of the landing page PR
  host: test3.eduide.student.k8s.aet.cit.tum.de
  gateway: *gateway
  config:
    title: EduIDE test3
    keycloak: *keycloak
