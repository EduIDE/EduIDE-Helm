# Test deployment "test3" of the Go control plane on cluster stud, namespace eduide-test3.
# Install steps are in README.md. The image tags pr-<N> are placeholders the deployer sets.
# The anchors state hosts and gateway once for both subcharts.

x-hosts: &hosts
  service: test3.eduide.student.k8s.aet.cit.tum.de
  instance: instance.test3.eduide.student.k8s.aet.cit.tum.de
  webview: webview.instance.test3.eduide.student.k8s.aet.cit.tum.de

x-gateway: &gateway
  name: eduide
  namespace: eduide-test3
  sectionName: ""
  # Only the HTTPS listeners: sessions and pages are never served on the ACME :80 listeners.
  port: 443

x-keycloak: &keycloak
  url: https://keycloak-test.aet.cit.tum.de/
  realm: tum
  clientId: eduide

gateway:
  create: true
  className: envoy

# The ClusterIssuer letsencrypt-prod-gateway solves HTTP01 only through the shared Gateway, so this
# namespaced Issuer (same ACME server and account email) solves through the Gateway of this namespace.
issuer:
  create: true
  name: letsencrypt-prod-gateway
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin.aet@xcit.tum.de

images:
  registry: ghcr.io/eduide
  tag: pr-241 # EduIDE/EduIDE#241: slimmed images (main with #238 and #240)

# Pinned by digest: the IDE image PR reuses its tag pr-<N>, and nodes keep cached images (IfNotPresent).
# All test3 templates are Artemis editions: Artemis sends the repository URL with the VCS token (Artemis#14702).
templateDefaults:
  gitUriAllowCredentials: true

templates:
  # The landing page offers the standalone editions; Artemis links start the unlisted artemis editions below.
  java-17-standalone:
    tag: pr-241@sha256:b07bc23a5abbb72ab455173a8160d697884520e02e7ee38de74e43177e7c9d72
    pool: {minIdle: 1, maxInstances: 5}
  java-25-standalone:
    tag: pr-241@sha256:c95988f2d5da5bcdeb322410a80a2ebdb1024d26a5cb1ea62e9412258e583164
  c-standalone:
    tag: pr-241@sha256:f25aabe5e78eacfff0a59f2df84e86d86ac5c31102af597424c9f64cff84896d
  java-17:
    tag: pr-241@sha256:a16ce059fadfa59f8a50563673b28aff9080a6e9ba0122a7af5d82e5dba39c58
    pool: {minIdle: 1, maxInstances: 5}
  c:
    tag: pr-241@sha256:6d872f9df26b8434ddfa12aaf07eb7cffc67fba1299bdc531adfcd80f601ff4d
  # Java 25 for testing with Artemis.
  java-25:
    tag: pr-241@sha256:ee6805269b2fdf04805417b40d987e9b5d7311981bbb95821aa0ad7214389b89

oidcBridge:
  enabled: true

eduide-control-plane:
  image:
    tag: pr-19 # EduIDE-control-plane#19 (listed templates, on main with the #18 audit fixes)
  # Pool scaler (POOL-18), active with tight limits so the shared cluster is not loaded.
  poolScaler:
    enabled: true
    mode: active
    config:
      prometheus: {url: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090}
      poolLimits:
        java-17: {floor: 1, ceiling: 4}
        java-17-standalone: {floor: 1, ceiling: 4}
  config:
    deployment: test3
    hosts: *hosts
    gateway: *gateway
    oidc:
      issuerURL: https://keycloak-test.aet.cit.tum.de/realms/tum
      clientIDs: [eduide]
      gatewayClientID: eduide
      # Admin panel (U16): client role eduide-admin on client eduide in realm tum.
      admin: {rolePath: resource_access.eduide.roles, role: eduide-admin}
    admin:
      prometheusURL: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090
    allowedHosts:
    - github.com
    - gitlab.com
    - codeberg.org
    # Artemis test hosts in use (repository URLs and ARTEMIS_URL).
    - artemis-test3.artemis.cit.tum.de
    workspaces:
      storageClassName: csi-rbd-sc
    placement:
      nodeSelector:
        aet.cit.tum.de/pool: eduide
      nodePoolLabel: aet.cit.tum.de/pool
      # Pulls the IDE and agent images onto every eduide node; a cold start without it waited 47 s for pulls.
      prepull: {enabled: true}
      # The eduide nodes of stud carry no taints, so no toleration is needed.
    telemetry:
      otlpEndpoint: jaeger-collector.eduide-test3:4317
  networkPolicy:
    monitoringNamespace: cattle-monitoring-system
    # stud uses public address ranges inside the cluster: nodes 131.159.88.0/24 and 2a09:80c0:88::/64,
    # pods 198.18.0.0/16, services 198.19.0.0/16. Artemis and Keycloak sit in 131.159.89.0/24, outside.
    sessionEgressExtraDeny: [131.159.88.0/24, 198.18.0.0/16, 198.19.0.0/16, "2a09:80c0:88::/64"]
  monitoring:
    podMonitor: {enabled: true}
    # stud routes EduIDE alerts through the AlertmanagerConfig in eduide-system (namespace matcher).
    rules: {enabled: true, extraLabels: {namespace: eduide-system}}
    # Grafana on stud only reads dashboards from cattle-dashboards (approved by the environment owner, MON-07).
    dashboard: {enabled: true, namespace: cattle-dashboards}
  oidc:
    # Created separately, see README.md.
    clientSecretName: eduide-oidc
    # keycloak-test speaks only P-384/P-521, Envoy only X25519/P-256: the chart's TLS bridge (oidcBridge) in between.
    providerBackendRefs:
    - {name: eduide-oidc-bridge, port: 443}
    # Set, so Envoy Gateway does not discover them through the backend.
    authorizationEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/auth
    tokenEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/token
    endSessionEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/logout

eduide-landing-page:
  # Placeholders for test3 (the chart requires both; U6: real legal texts live with the deployment).
  legal:
    imprint:
      url: https://example.org/imprint
    privacy:
      url: https://example.org/privacy
  image:
    tag: pr-19 # EduIDE-control-plane#19 (listed templates, landing page)
  host: test3.eduide.student.k8s.aet.cit.tum.de
  gateway: *gateway
  config:
    title: EduIDE test3
    keycloak: *keycloak
