# EXPERIMENTAL: test deployment "test3" of the Go control plane on cluster stud, namespace eduide-test3.
# Install steps are in README.md. The image tags pr-<N> are placeholders the deployer sets.
# The anchors state hosts and gateway once for both subcharts.

x-hosts: &hosts
  service: test3.eduide.student.k8s.aet.cit.tum.de
  instance: instance.test3.eduide.student.k8s.aet.cit.tum.de
  webview: webview.instance.test3.eduide.student.k8s.aet.cit.tum.de

x-gateway: &gateway
  name: eduide
  namespace: eduide-test3
  sectionName: ""
  # Only the HTTPS listeners: sessions and pages are never served on the ACME :80 listeners.
  port: 443

x-keycloak: &keycloak
  url: https://keycloak-test.aet.cit.tum.de/
  realm: tum
  clientId: eduide

gateway:
  create: true
  className: envoy

# The ClusterIssuer letsencrypt-prod-gateway solves HTTP01 only through the shared Gateway, so this
# namespaced Issuer (same ACME server and account email) solves through the Gateway of this namespace.
issuer:
  create: true
  name: letsencrypt-prod-gateway
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin.aet@xcit.tum.de

images:
  registry: ghcr.io/eduide
  tag: pr-238 # EduIDE/EduIDE#238 builds the images with eduide-session

# Pinned by digest: the IDE image PR reuses the tag pr-238, and nodes keep cached images (IfNotPresent).
templates:
  java-17:
    tag: pr-238@sha256:5dc51a62ca622b2eea0b182f0f65dc01593a8b73cd51eb2ad841eaae0d23b448
    pool: {minIdle: 1, maxInstances: 5}
  c:
    tag: pr-238@sha256:32135d30c09dc395eaddc2b3799f4b4e5a381923fd1845472e0ee503f27933dd

eduide-control-plane:
  image:
    tag: sha-2bb3ecc # EduIDE-control-plane main
  config:
    deployment: test3
    hosts: *hosts
    gateway: *gateway
    oidc:
      issuerURL: https://keycloak-test.aet.cit.tum.de/realms/tum
      clientIDs: [eduide]
      gatewayClientID: eduide
    allowedHosts:
    - github.com
    - gitlab.com
    - codeberg.org
    # Artemis test hosts: add the artemis-test*.artemis.cit.tum.de hosts in use.
    workspaces:
      storageClassName: csi-rbd-sc
    placement:
      nodeSelector:
        aet.cit.tum.de/pool: eduide
      nodePoolLabel: aet.cit.tum.de/pool
      # Pulls the IDE and agent images onto every eduide node; a cold start without it waited 47 s for pulls.
      prepull: {enabled: true}
      # The eduide nodes of stud carry no taints, so no toleration is needed.
    telemetry:
      otlpEndpoint: jaeger-collector.eduide-test3:4317
  networkPolicy:
    monitoringNamespace: cattle-monitoring-system
    # stud uses public address ranges inside the cluster: nodes 131.159.88.0/24 and 2a09:80c0:88::/64,
    # pods 198.18.0.0/16, services 198.19.0.0/16. Artemis and Keycloak sit in 131.159.89.0/24, outside.
    sessionEgressExtraDeny: [131.159.88.0/24, 198.18.0.0/16, 198.19.0.0/16, "2a09:80c0:88::/64"]
  monitoring:
    podMonitor: {enabled: true}
    rules: {enabled: true}
    dashboard: {enabled: true}
  oidc:
    # Created separately, see README.md.
    clientSecretName: eduide-oidc
    # stud: Envoy pods have no direct egress to Keycloak, see keycloak-egress.yaml.
    providerBackendRefs:
    - {name: keycloak-egress, port: 443}
    # Set, so Envoy Gateway does not discover them through the backend.
    authorizationEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/auth
    tokenEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/token
    endSessionEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/logout

eduide-landing-page:
  image:
    tag: sha-2bb3ecc # EduIDE-control-plane main (landing page)
  host: test3.eduide.student.k8s.aet.cit.tum.de
  gateway: *gateway
  config:
    title: EduIDE test3
    # Legal pages of the existing TUM landing page (U6: they live outside the control plane repo).
    legal:
      imprintUrl: https://test1.eduide.student.k8s.aet.cit.tum.de/imprint
      privacyUrl: https://test1.eduide.student.k8s.aet.cit.tum.de/privacy
    keycloak: *keycloak
