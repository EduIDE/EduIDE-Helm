apiVersion: v2
name: eduide-go
description: |
  EXPERIMENTAL. EduIDE on the Go control plane for one deployment: control plane, landing page,
  Gateway, optional ACME Issuer and the IDETemplates and IDEPools. The CRDs are a separate
  per-cluster install (eduide-control-plane-crds) and must be installed first.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: eduide-control-plane
    version: "0.1.0"
    repository: "oci://ghcr.io/eduide/eduide-control-plane/charts"
  - name: eduide-landing-page
    version: "0.1.0"
    repository: "oci://ghcr.io/eduide/eduide-control-plane/charts"
