{{- if .Values.oidcBridge.enabled }}
{{- $host := (urlParse (required "eduide-control-plane.config.oidc.issuerURL is required for oidcBridge" (index .Values "eduide-control-plane").config.oidc.issuerURL)).host }}
{{- $name := printf "%s-oidc-bridge" .Release.Name }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
spec:
  secretName: {{ $name }}-tls
  dnsNames: [{{ $host | quote }}]
  duration: 8760h
  issuerRef: {name: {{ $name }}-selfsigned, kind: Issuer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name {{ $host }};
      ssl_certificate /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      access_log off;
      location / {
        proxy_pass https://{{ $host }};
        proxy_ssl_server_name on;
        proxy_ssl_name {{ $host }};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host {{ $host }};
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: oidc-bridge, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.oidcBridge.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: oidc-bridge, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oidc-bridge, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ $host | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: {{ .Values.oidcBridge.image }}
          ports:
            - {name: tls, containerPort: 8443}
          readinessProbe:
            tcpSocket: {port: 8443}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: {{ $name }}}
        - name: tls
          secret: {secretName: {{ $name }}-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app.kubernetes.io/name: oidc-bridge, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: tls, port: 443, targetPort: 8443}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ $name }}
spec:
  targetRefs:
    - {group: "", kind: Service, name: {{ $name }}}
  validation:
    hostname: {{ $host | quote }}
    caCertificateRefs:
      - {group: "", kind: Secret, name: {{ $name }}-tls}
---
# Only the Envoy proxies reach the bridge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-from-envoy
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: oidc-bridge, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
      ports:
        - {port: 8443}
{{- end }}
