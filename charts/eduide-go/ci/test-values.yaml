gateway:
  className: example
issuer:
  create: true
  acme: {email: admin@example.org}
templates:
  java-17: {pool: {minIdle: 1, maxInstances: 5}}
  c: {}
eduide-control-plane:
  config:
    deployment: ci
    hosts: {service: ide.example.org, instance: sessions.example.org}
    gateway: {name: eduide}
    oidc:
      issuerURL: https://auth.example.org/realms/eduide
      clientIDs: [eduide-landing]
      gatewayClientID: eduide-gateway
  oidc: {clientSecretName: eduide-oidc}
eduide-landing-page:
  host: ide.example.org
  gateway: {name: eduide}
  config:
    keycloak: {url: https://auth.example.org, realm: eduide, clientId: eduide-landing}
