{{- /*
The bearer token the admin scaling API checks. The service template already
references this Secret by name; before 2.0.0 it was created by a separate
theia-certificates chart, whose other three templates were disabled in every
environment. Carrying one Secret is not worth a chart.

The token itself comes from the environment's GitHub Environment secret, never
from a values file in git.
*/ -}}
{{- if .Values.service.adminApiTokenSecret.create }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.service.adminApiTokenSecret.name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: service
data:
  {{ .Values.service.adminApiTokenSecret.key }}: {{ required "service.adminApiTokenSecret.create is true but service.adminApiToken is empty" .Values.service.adminApiToken | quote }}
{{- end }}
