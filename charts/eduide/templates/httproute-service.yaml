{{- if and .Values.gateway.enabled .Values.gateway.routes.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
{{ include "theia-cloud.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ include "theia-cloud.host.service" . }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /service
    {{- if .Values.gateway.serviceRouteRequestTimeout }}
    timeouts:
      request: {{ .Values.gateway.serviceRouteRequestTimeout | quote }}
    {{- end }}
    backendRefs:
    - name: service-service
      port: {{ .Values.service.port }}
{{- end }}
