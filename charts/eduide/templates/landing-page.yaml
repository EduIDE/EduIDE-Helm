{{- if .Values.landingPage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page-deployment
  labels:
    app: landing-page
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.landingPage.replicas }}
  {{- /* Start the new pod before stopping the old one, so a deploy never leaves the route without a ready pod. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/landing-page-config-map.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "eduide.spreadAcrossNodes" "landing-page" | nindent 6 }}
      containers:
        - name: landing-page-container
          image: {{ tpl (.Values.landingPage.image | toString) . }}
          imagePullPolicy: {{ if .Values.landingPage.imagePullPolicy }}{{ tpl (.Values.landingPage.imagePullPolicy | toString) . }}{{ else }}{{ tpl (.Values.imagePullPolicy | toString) . }}{{ end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /config.js
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            {{- include "eduide.preStopDrain" . | nindent 12 }}
          volumeMounts:
            - name: landing-page-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          {{- if .Values.landingPage.logoData }}
            - name: landing-page-config
              mountPath: /usr/share/nginx/html/logo.png
              subPath: logo.png
          {{- end }}
            {{- /* nginx-unprivileged keeps its pid file and temp paths here. */}}
            - name: tmp
              mountPath: /tmp
      {{- if .Values.landingPage.imagePullSecret }}
      imagePullSecrets:
        - name: {{ tpl (.Values.landingPage.imagePullSecret | toString) . }}
      {{- end }}
      volumes:
        - name: landing-page-config
          configMap:
            name: landing-page-config
        - name: tmp
          emptyDir: {}
{{- end}}
---
{{- if .Values.landingPage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: landing-page-service
  labels:
    app: landing-page
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: landing-page
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
{{- end }}
