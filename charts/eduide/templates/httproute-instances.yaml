{{- if and .Values.gateway.enabled .Values.gateway.routes.enabled }}
{{/*
  rules is intentionally empty. The operator patches rules into this route at
  runtime, one per live session. Adding a placeholder rule here would be
  reconciled away, and a Go-template comment is used so the note does not end
  up in the rendered manifest.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ tpl (.Values.gateway.instancesRouteName | toString) . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
{{ include "theia-cloud.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ include "theia-cloud.host.instance" . | quote }}
  {{- include "theia-cloud.host.wildcardInstances" . | trim | nindent 2 }}
  rules: []
{{- end }}
