{{- if and .Values.gateway.enabled .Values.gateway.routes.enabled }}
{{/*
  `rules` is deliberately ABSENT, not empty.

  This route is a TEMPLATE the operator reads, not one it writes. For each
  session it copies this route's `parentRefs` and `hostnames` onto a brand-new
  HTTPRoute of its own (`IngressManager.buildSessionRoute` in EduIDE-Cloud),
  owner-referenced to the Session so Kubernetes garbage-collects it when the
  session ends. Nothing ever patches rules into this object.

  `rules: []` was wrong twice over. Gateway API v1.5 added `minItems: 1`, so the
  API server rejects the create outright - v1.3 accepted it, which is why this
  only surfaced on a newer cluster. And Helm would carry `rules: []` as desired
  state, so every `helm upgrade` would patch the live route back to zero rules.

  Omitting the field avoids both: nothing to reject, and no patch generated for
  a field the chart does not own.

  Requests that match no live session are caught by `httproute-session-ended.yaml`,
  which redirects them to the landing page instead of letting Envoy answer 404.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ tpl (.Values.gateway.instancesRouteName | toString) . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
{{ include "theia-cloud.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ include "theia-cloud.host.instance" . | quote }}
  {{- include "theia-cloud.host.wildcardInstances" . | trim | nindent 2 }}
{{- end }}
