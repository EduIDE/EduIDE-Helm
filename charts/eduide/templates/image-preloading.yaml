{{ if .Values.preloading.enable -}}

{{- /*
The list is derived from appDefinitions.apps, their sidecars and the landing
page, with preloading.images appended. Nothing has to be listed by hand, so the
preloaded set cannot disagree with what the installation actually offers - the
old hand-written, index-addressed list is why production offered c-templates
while preloading everything except c-templates.
*/ -}}
{{- $images := include "eduide.preloadImages" . | fromJsonArray -}}
{{- if and (not $images) .Values.demoApplication.install -}}
  {{- $images = list .Values.demoApplication.name -}}
{{- end -}}
{{- if not $images -}}
{{- fail "preloading.enable is true but no images resolved: set appDefinitions.apps, or preloading.images, or disable preloading" -}}
{{- end -}}

{{- /* Set image pull policy to local variable for increase readability. */ -}}
{{- $imagePullPolicy := tpl (.Values.imagePullPolicy | toString) . -}}
{{- if .Values.preloading.imagePullPolicy -}}
  {{- $imagePullPolicy = tpl ($.Values.preloading.imagePullPolicy | toString) . -}}
{{- end -}}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-preloading
  namespace: {{ .Release.Namespace }}
  labels:
    app: image-preloading
    app.kubernetes.io/name: image-preloading
    app.kubernetes.io/part-of: theia-cloud
spec:
  selector:
    matchLabels:
      app: image-preloading
      app.kubernetes.io/name: image-preloading
      app.kubernetes.io/part-of: theia-cloud
  template:
    metadata:
      labels:
        app: image-preloading
        app.kubernetes.io/name: image-preloading
        app.kubernetes.io/part-of: theia-cloud
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
    spec:
      # The pod can be killed instantly because it doesn't do any work requiring graceful shutdown
      terminationGracePeriodSeconds: 0
      {{- /*
      Images are pulled by PLAIN CONTAINERS, not init containers.

      Init containers run strictly one after another, so nine multi-GB images
      were pulled in series on every node - the node finished the last one long
      after it could have. Containers in a pod are started together, and this
      cluster's kubelet has serializeImagePulls=false, so the pulls now overlap.

      Each container therefore has to stay alive; a container that exits in a
      DaemonSet pod is restarted forever. `sleep infinity` is what keeps it
      parked, costing the requests below and nothing else.

      An entry that carries its own `command`/`args` is a different thing - a
      one-shot that is expected to run and exit - so those stay init containers
      and keep their old semantics.
      */}}
      {{- $shellEntries := list }}
      {{- $jobEntries := list }}
      {{- range $entry := $images }}
        {{- if and (kindIs "map" $entry) (or $entry.command (hasKey $entry "args")) }}
          {{- $jobEntries = append $jobEntries $entry }}
        {{- else }}
          {{- $shellEntries = append $shellEntries $entry }}
        {{- end }}
      {{- end }}
      {{- if $jobEntries }}
      initContainers:
      {{- range $index, $entry := $jobEntries }}
      - name: image-preload-job-{{ $index }}
        image: {{ tpl ($entry.image | toString) $ | quote }}
        imagePullPolicy: {{ $imagePullPolicy }}
        {{- with $entry.command }}
        command:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if hasKey $entry "args" }}
        args:
          {{- toYaml $entry.args | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml $.Values.preloading.resources | nindent 10 }}
      {{- end }}
      {{- end }}
      containers:
      {{- range $index, $entry := $shellEntries }}
      {{- $imageRef := "" }}
      {{- if kindIs "map" $entry }}
      {{- $imageRef = tpl ($entry.image | toString) $ }}
      {{- else }}
      {{- $imageRef = tpl ($entry | toString) $ }}
      {{- end }}
      - name: image-preload-{{ $index }}
        image: {{ $imageRef | quote }}
        imagePullPolicy: {{ $imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - {{ printf "echo 'Loaded image %s'; exec sleep infinity" $imageRef | quote }}
        resources:
          {{- toYaml $.Values.preloading.resources | nindent 10 }}
      {{- end }}
      {{- if not $shellEntries }}
      # Nothing to keep the Pod running otherwise.
      - name: run
        image: registry.k8s.io/pause:3.9
        resources:
          {{- toYaml $.Values.preloading.resources | nindent 10 }}
      {{- end }}
{{- end }}