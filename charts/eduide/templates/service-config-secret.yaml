{{- /*
Sensitive service configuration. These used to sit in the `service-config`
ConfigMap in plaintext (and the auth token was also passed to the operator as a
plaintext `--serviceAuthToken` arg visible in the Deployment spec). They now
live in a Secret, consumed by the service via `envFrom.secretRef` and by the
operator via `secretKeyRef`, keeping the same environment variable names.
*/ -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: service-config-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: service
stringData:
  SERVICE_AUTH_TOKEN: {{ tpl ((.Values.service.authToken | default .Values.app.id) | toString) . | quote }}
  {{- if eq (tpl (.Values.keycloak.enable | toString) .) "true" }}
  KEYCLOAK_CLIENTSECRET: {{ tpl (.Values.keycloak.clientSecret | toString) . | quote }}
  {{- end }}
