{{- if and .Values.gateway.enabled .Values.gateway.routes.enabled .Values.gateway.routes.sessionEndedRedirect.enabled .Values.landingPage.enabled }}
{{- $redirect := .Values.gateway.routes.sessionEndedRedirect }}
{{- $code := default 302 $redirect.statusCode }}
{{/*
  Catches requests to session paths that no longer exist.

  The operator gives every session its own HTTPRoute, owner-referenced to the
  Session, so Kubernetes garbage-collects the route the moment the session is
  deleted. Without this route the path then matches nothing and the student gets
  a bare Envoy 404 on reload, with no explanation and no way back.

  This is a SEPARATE route rather than a rule on `httproute-instances.yaml`,
  deliberately: that route is an input the operator reads (it copies its
  parentRefs and hostnames onto every session route). Leaving it rule-free keeps
  that one-way relationship intact.

  WHY THIS DOES NOT SWALLOW LIVE SESSIONS. Gateway API resolves matches across
  all routes on a listener by hostname specificity first, then by the number of
  characters in the matching path. This route and the session routes carry the
  same hostnames, so path length decides: a session's `/<uid>/` prefix, and its
  `Exact` rule, both outrank `/`. The catch-all only ever sees requests no live
  session claims.

  301 IS FORBIDDEN HERE, despite the cluster chart's redirect template arguing
  for it. Eager sessions reuse stable paths (`/<appdef>-<instance>/`), so a
  cached permanent redirect would break that instance in that browser for good -
  for every student who lands on it afterwards.
*/}}
{{- if ne (int $code) 302 }}
{{- fail (printf "gateway.routes.sessionEndedRedirect.statusCode is %v; only 302 is allowed. Eager sessions reuse instance paths, so a cached 301 would permanently break an instance in the user's browser." $code) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: session-ended-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
{{ include "theia-cloud.gateway.parentRefs" . | nindent 2 }}
  hostnames:
  - {{ include "theia-cloud.host.instance" . | quote }}
  {{- if $redirect.includeWildcardInstances }}
  {{- include "theia-cloud.host.wildcardInstances" . | trim | nindent 2 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: {{ include "theia-cloud.host.landing" . | quote }}
        statusCode: {{ int $code }}
        path:
          type: ReplaceFullPath
          replaceFullPath: {{ $redirect.path | quote }}
{{- end }}
