{{- /*
The operator keeps one data bridge token Secret per prewarmed pool instance
(instance-<n>-<appdef>-bridge-token): it creates it, rotates it on release and
deletes it on scale-down. It reads each Secret by name, so no list or watch.
resourceNames cannot narrow this: the names are dynamic and create ignores them.
See EduIDE/EduIDE-Cloud#157.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-bridge-token-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-bridge-token-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: operator
subjects:
  - kind: ServiceAccount
    name: operator-api-service-account
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-bridge-token-secrets
