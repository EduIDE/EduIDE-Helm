{{- /*
Network isolation for session pods.

Session pods run untrusted user code. They are selected by the theia-cloud
labels the operator stamps on every session (see LabelsUtil in EduIDE-Cloud:
app.kubernetes.io/component=session, app.kubernetes.io/part-of=theia-cloud).

NetworkPolicies are allow-only and additive, so the model is: one policy that
denies all ingress and egress for session pods, then narrow allow policies on
top. The cloud metadata endpoint is excluded from the external-egress allow so
a compromised session cannot read instance credentials, even when general
outbound access is on.

Operator, service and landing-page pods are deliberately left unpoliced.
*/ -}}
{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
{{- $sessionSelector := dict "app.kubernetes.io/component" "session" "app.kubernetes.io/part-of" "theia-cloud" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: session-network-policy
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sessionSelector | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: session-network-policy
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sessionSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dnsNamespace | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-allow-gateway-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: session-network-policy
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sessionSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.gatewayNamespace | quote }}
      ports:
        {{- range $np.sessionPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- if $np.allowExternalEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-allow-external-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eduide
    app.kubernetes.io/component: session-network-policy
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sessionSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ $np.metadataCidr | quote }}
{{- end }}
{{- end }}
