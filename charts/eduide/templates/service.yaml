apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-deployment
  labels:
    app: service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.service.replicas }}
  {{- /* Start the new pod before stopping the old one, so a deploy never leaves the route without a ready pod. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: service
  template:
    metadata:
      labels:
        app: service
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/service-configmap.yaml") . | sha256sum }}
    spec:
      # we need to be able to create and read sessions
      automountServiceAccountToken: true
      serviceAccountName: service-api-service-account
      {{- include "eduide.spreadAcrossNodes" "service" | nindent 6 }}
      containers:
      - name: service-container
        image: {{ tpl (.Values.service.image | toString) . }}
        imagePullPolicy: {{ if .Values.service.imagePullPolicy }}{{ tpl (.Values.service.imagePullPolicy | toString) . }}{{ else }}{{ tpl (.Values.imagePullPolicy | toString) . }}{{ end }}
        ports:
        - name: http
          containerPort: {{ tpl (.Values.service.port | toString) . }}
          protocol: TCP
        {{- /*
        The service has no health endpoint. An open port means Quarkus is up,
        which is what matters: without this the pod counted as ready the moment
        the container started and the old one was stopped too early.
        */}}
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        lifecycle:
          {{- include "eduide.preStopDrain" . | nindent 10 }}
        envFrom:
        - configMapRef:
            name: service-config
        env:
        - name: SENTRY_ENABLE
          value: {{ tpl (.Values.service.sentry.enable | toString) . | quote }}
      {{- /*
      Only mount the token when something actually supplies it. This used to be
      gated on the name and key alone, both of which have defaults, so a default
      install always referenced a Secret that `create: false` meant nobody had
      created - and the pod sat in CreateContainerConfigError forever, taking
      every session launch with it.
      */}}
      {{- if and .Values.service.adminApiTokenSecret.name .Values.service.adminApiTokenSecret.key (or .Values.service.adminApiTokenSecret.create .Values.service.adminApiTokenSecret.external) }}
        - name: ADMIN_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ tpl (.Values.service.adminApiTokenSecret.name | toString) . }}
              key: {{ tpl (.Values.service.adminApiTokenSecret.key | toString) . }}
      {{- end }}
      {{- if .Values.service.imagePullSecret }}
      imagePullSecrets:
        - name: {{ tpl (.Values.service.imagePullSecret | toString) . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: service-service
  labels:
    app: service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: service
  ports:
    - name: http
      protocol: TCP
      port: {{ tpl (.Values.service.port | toString) . }}
      targetPort: {{ tpl (.Values.service.port | toString) . }}
