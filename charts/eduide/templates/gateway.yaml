{{- if and .Values.gateway.enabled .Values.gateway.create }}
{{- /*
This is the per-namespace Gateway, not the shared one. Its HTTPS listeners name
three Secrets that neither chart creates, so unless you have made them yourself
the listeners never program and the only symptom is a TLS failure in a browser.
Refuse to render rather than hand over something that applies cleanly and does
not work.
*/}}
{{- if and .Values.gateway.tls (not .Values.gateway.acknowledgeManualCertificates) }}
{{- fail (printf "gateway.create is true with TLS, which needs the Secrets %q, %q and %q to already exist in namespace %q - no chart creates them. Either use the shared Gateway (gateway.create=false plus gateway.parentRefs, the supported path), or create those three Secrets and set gateway.acknowledgeManualCertificates=true."
      "ws-cert-secret" "service-cert-secret" "landing-page-cert-secret" .Release.Namespace) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
  {{- if .Values.gateway.tls }}
  - name: https-instances
    protocol: HTTPS
    port: {{ .Values.gateway.httpsPort }}
    hostname: {{ include "theia-cloud.host.instance" . }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: ws-cert-secret
  - name: https-service
    protocol: HTTPS
    port: {{ .Values.gateway.httpsPort }}
    hostname: {{ include "theia-cloud.host.service" . }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: service-cert-secret
  {{- if .Values.landingPage.enabled }}
  - name: https-landing
    protocol: HTTPS
    port: {{ .Values.gateway.httpsPort }}
    hostname: {{ include "theia-cloud.host.landing" . }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: landing-page-cert-secret
  {{- end }}
  {{- range $wildcard := .Values.hosts.allWildcardInstances }}
  - name: {{ include "theia-cloud.gateway.wildcardListenerName" (dict "wildcard" $wildcard) }}
    protocol: HTTPS
    port: {{ $.Values.gateway.httpsPort }}
    hostname: {{ printf "%s%s" (tpl $wildcard $) (include "theia-cloud.host.instance" $) | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ if hasKey $.Values.gateway.instancesWildcardSecretNames $wildcard }}{{ tpl (get $.Values.gateway.instancesWildcardSecretNames $wildcard) $ | quote }}{{ else }}ws-cert-secret{{ end }}
  {{- end }}
  {{- end }}
  {{- if .Values.gateway.httpEnabled }}
  - name: http
    protocol: HTTP
    port: {{ .Values.gateway.httpPort }}
  {{- end }}
{{- end }}
