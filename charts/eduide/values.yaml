# -- Image versions, one per source repository. Every image the chart deploys
# derives its tag from one of these three, so a release is three numbers rather
# than nineteen image strings scattered across environment values files.
# @default -- (see details below)
versions:
  # -- The IDE images from the EduIDE repository (java-17, c, python, ...).
  # Empty falls through to the chart's appVersion, which is what a release sets,
  # so a plain `helm install --version 2.0.0` pins every IDE image to the tag
  # that release published.
  ide: ""
  # -- EduIDE-Cloud: the operator and the REST service. Released independently
  # of the IDE images, so it carries its own version.
  cloud: "1.2.0"
  # -- EduIDE-Landing-Page. Released independently as well.
  landingPage: "1.2.0"

# -- The container registry every EduIDE image is pulled from.
imageRegistry: ghcr.io/eduide

# -- The default imagePullPolicy for containers of theia cloud.
# Can be overridden for individual components by specifying the imagePullPolicy variable there.
# Possible values:
# - Always
# - IfNotPresent
# - Never
imagePullPolicy: Always
# -- General information about the deployed app
# @default -- (see details below)
app:
  # -- (Deprecated) The app id which is used in the communication between website and REST-API
  # as a spam migitation. This id is public. Please choose an random generated string.
  # Use service.authToken instead.
  id: asdfghjkl
  # -- The name of the application that may be displayed e.g. on the landing pages
  name: Theia Blueprint
# -- Information about the demo application to be installed
# @default -- (see details below)
demoApplication:
  # -- Should the demo application be installed
  install: true
  # -- The name of docker image to be used
  name: theiacloud/theia-cloud-demo:1.2.0-next
  # -- Optional: Override the imagePullPolicy for the main application's docker image.
  # If this is omitted or empty, the root at .Values.imagePullPolicy is used.
  imagePullPolicy:
  # -- the image pull secret. Leave empty if registry is public
  pullSecret: ""
  # -- Limit in minutes
  timeout: "30"
  # -- Values that are used by the monitor
  # @default -- (see details below)
  monitor:
    # -- At which port the monitor extension is available
    # For the Theia extension take the same as the application port
    # For the VSCode extension take 8081 (default) or the port specified via the THEIACLOUD_MONITOR_PORT env variable
    port: 3000
    # -- Values that are used by the activityTracker module
    # @default -- (see details below)
    activityTracker:
      # -- Minutes of inactivity that lead to pod shutdown
      timeoutAfter: 30
      # -- Minutes of inactivity that lead to a warning displayed to the user
      # Make greater than timeoutAfter to disable
      notifyAfter: 25
# -- You may adjust the hostname below.
# @default -- (see details below)
hosts:
  # -- Configuration for the hostnames. Contains the baseHost and afixes for all services
  # @default -- (see details below)
  configuration:
    # -- baseHost configures the host for all services.
    # Service names are prepended as subdomains, e.g. service.<landing>.<baseHost>
    baseHost: 192.168.39.173.nip.io
    # -- afix of the REST service
    service: servicex
    # -- afix of the landing page
    landing: trynow
    # -- afix for deployed instances
    instance: instances
  # -- all additional wildcard hostnames that may be required in the launched Theia-applications, e.g.
  # "*.webview." which leads to "*.webview.ws.192.168.39.173.nip.io" to expose webviews.
  # Please note that this means that this usually means that all "ingressHostnamePrefixes" patterns from
  # all app definitions need to be added.
  # IMPORTANT: If this gets updated, the helm chart needs to be re-installed because
  # helm upgrade will not properly update this at the moment.
  # These are required to configure TLS (if enabled via gateway.tls == true)
  # I.e. custom certificates or a cert-manager provider that can handle wildcard certificates need to be configured.
  allWildcardInstances: []
# -- Values related to the landing page
# @default -- (see details below)
landingPage:
  # -- Whether the landing page shall be enabled
  enabled: true
  # -- the landing page image to use. Templated, so the tag follows
  # versions.landingPage unless the whole string is overridden.
  image: '{{ .Values.imageRegistry }}/eduidec-landing-page:{{ .Values.versions.landingPage }}'
  # -- Optional: Override the imagePullPolicy for the landing page's docker image.
  # If this is omitted or empty, the root at .Values.imagePullPolicy is used.
  imagePullPolicy:
  # -- Optional: the image pull secret
  imagePullSecret:
  # -- Values related to Sentry on the landing page.
  # @default -- (see details below)
  sentry:
    # -- Whether to set SENTRY_ENABLE=true in the landing page deployment.
    enable: true
  # -- the app id to launch
  appDefinition: "java-17-templates-latest"
  # -- If set to true no persisted storage is used when creating sessions on the landing page.
  # Set to false if you want to use persisted storage.
  ephemeralStorage: true
  # -- The page may show these additional apps in a drop down. This is a map.
  # The key maps to the app definition name
  # The value contains the label shown in the UI and may optionally contain
  # an image override that is forwarded to the landing page config.
  #
  # Example:
  # different-app-definition:
  #   label: "Different App Definition"
  #   image: "different-app-definition"
  #   visible: false
  # further-app-definition:
  #   label: "Further App Definition"
  additionalApps:
  # different-app-definition:
  #   label: "Different App Definition"
  #   image: "different-app-definition"
  # further-app-definition:
  #   label: "Further App Definition"

  # -- Should showing info title and text below the launch button be disabled
  # true hides the info title and text
  # false shows the info title and text
  disableInfo: false
  # -- Optional: If specified with a value, this overrides the info text shown on the landing page.
  # Empty values are ignored. Use `disableInfo` to deactivate showing the info completely.
  infoText:
  # -- Optional: If specified with a value, this overrides the title of the info text shown on the landing page.
  # Empty values are ignored. Use `disableInfo` to deactivate showing the info completely.
  infoTitle:
  # -- Optional: If specified with a value, this overrides the message shown to the user while the session is started.
  # Empty values are ignored and the default text is used.
  loadingText:
  # -- The logo of the application that should be displayed on the landing pages
  logo: logos/theiablueprint.svg
  # -- Set a base64 encoded svg image that should be displayed on the landing pages.
  # If this is given, the logo value above is ignored.
  # On Linux, you can directly generate the base64 string when applying the chart like this:
  # --set landingPage.logoData=$(cat path/to/file.svg | base64 -w 0 -)
  # Another way is to directly add the base64 string to the values file.
  logoData:
  # -- The file extension of the logo. Must be set to match the logo respectively the logoData.
  # This is required because browsers cannot show a binary image (e.g. png) with a svg ending
  # and vice-versa.
  logoFileExtension: "svg"
  # -- Optional: Customize footer links on the landing page
  # All footer link configurations are optional. If not provided, default values will be used.
  # @default -- (see details below)
  footerLinks:
  # # -- Optional: Attribution section (bottom left of footer)
  # attribution:
  #   # -- Text to display (e.g., "Built by TUM AET Team")
  #   text: "Built by TUM AET Team 👨‍💻"
  #   # -- URL to link to (e.g., team website)
  #   url: "https://aet.cit.tum.de/"
  #   # -- Version string to display (e.g., "v1.0.0")
  #   version: "v1.0.0"
  #
  # # -- Optional: Bug report link
  # bugReport:
  #   # -- Link text (e.g., "Report a bug")
  #   text: "Report a bug"
  #   # -- URL for bug reports (e.g., GitHub issues)
  #   url: "https://github.com/eclipse-theia/theia-cloud/issues"
  #   # -- Optional: Link target (_blank or _self)
  #   target: "_blank"
  #   # -- Optional: Link rel attribute
  #   rel: "noreferrer"
  #
  # # -- Optional: Feature request link
  # featureRequest:
  #   # -- Link text (e.g., "Request a feature")
  #   text: "Request a feature"
  #   # -- URL for feature requests (e.g., GitHub issues)
  #   url: "https://github.com/eclipse-theia/theia-cloud/issues"
  #   # -- Optional: Link target (_blank or _self)
  #   target: "_blank"
  #   # -- Optional: Link rel attribute
  #   rel: "noreferrer"
  #
  # # -- Optional: About link
  # about:
  #   # -- Link text (e.g., "About")
  #   text: "About"
  #   # -- URL for about page
  #   url: "https://theia-cloud.io/"
  #   # -- Optional: Link target (_blank or _self)
  #   target: "_blank"
  #   # -- Optional: Link rel attribute
  #   rel: "noreferrer"
# -- Values related to Keycloak
# @default -- (see details below)
keycloak:
  # -- Whether keycloak authentication shall be used
  enable: false
  # -- The name of the Keycloak group identifying admin users who are allowed to access the service's admin endpoints.
  adminGroup: "theia-cloud/admin"
  # -- Key cloak auth URL. Only has to be specified when enable: true
  authUrl: "https://keycloak.url/auth/"
  # -- The Keycloak Realm. Only has to be specified when enable: true
  realm: "TheiaCloud"
  # -- The client-id. Only has to be specified when enable: true
  clientId: "theia-cloud"
  # -- The oaid client secret. In case you configure your keycloak client as confidential,
  # then you may specifiy the secret here.
  # If you stick with our default public client, you may leave below value. For public clients
  # keycloak does not generate a client-secret, but in order to make oath2-proxy happy,
  # we will pass a value
  clientSecret: "publicbutoauth2proxywantsasecret"
  # -- The cookie secret. This should not be public! Only has to be specified when enable: true
  # See https://oauth2-proxy.github.io/oauth2-proxy/docs/configuration/overview/#generating-a-cookie-secret
  # for how to generate a strong cookie secret.
  cookieSecret: "OQINaROshtE9TcZkNAm5Zs2Pv3xaWytBmc5W7sPX7ws="

# -- Values related to Gitea / generic OIDC authentication.
# Mutually exclusive with keycloak (a single oauth2-proxy provider is supported per session).
# @default -- (see details below)
gitea:
  # -- Whether Gitea / generic OIDC authentication shall be used
  enable: false

  # -- The Gitea base URL used as the OIDC issuer. Only has to be specified when enable: true.
  # This must be the issuer base URL without a trailing slash and without a realms path,
  # e.g. "https://gitea.example.com".
  issuerUrl: "https://gitea.example.com"

  # -- The client-id. Only has to be specified when enable: true
  clientId: "theia-cloud"

  # -- The client secret configured for the OIDC application in Gitea.
  # Must be provided (rendering fails when gitea.enable is true and this is empty).
  clientSecret: ""

  # -- The cookie secret. This should not be public! Must be provided when enable: true
  # (rendering fails when gitea.enable is true and this is empty).
  # See https://oauth2-proxy.github.io/oauth2-proxy/docs/configuration/overview/#generating-a-cookie-secret
  # for how to generate a strong cookie secret.
  cookieSecret: ""

# -- Values related to OAuth2 Proxy configuration
oauth2Proxy:
  # -- Whether OAuth2 Proxy skips TLS certificate verification of the OIDC provider
  # (sets ssl_insecure_skip_verify). Defaults to false to enforce certificate validation.
  # Set to true only when the provider uses a self-signed or otherwise untrusted certificate.
  sslInsecureSkipVerify: false

  # Allowed redirect domains for OAuth2 Proxy (controls whitelist_domains).
  # When empty, defaults are used:
  #   [ "<instance>:*", "<keycloak host>:*" ]
  whitelistDomains: []
  # Cookie domains for OAuth2 Proxy.
  # When empty, defaults are used:
  #   [ "<instance>.<baseHost>" ]
  cookieDomains: []
# -- Values related to the operator
# @default -- (see details below)
operator:
  # -- The operator image. Templated, so the tag follows versions.cloud unless
  # the whole string is overridden.
  image: '{{ .Values.imageRegistry }}/eduide-cloud/operator:{{ .Values.versions.cloud }}'
  # -- Optional: Override the imagePullPolicy for the operator's docker image.
  # If this is omitted or empty, the root at .Values.imagePullPolicy is used.
  imagePullPolicy:
  # -- Optional: the image pull secret
  imagePullSecret:
  # -- Values related to Sentry on the operator.
  # @default -- (see details below)
  sentry:
    # -- Whether to set SENTRY_ENABLE=true in the operator deployment.
    enable: true
  # -- Whether theia applications shall be started eager. This means that the application is already
  # running without a user. When a user requests a new session, one of the already launched ones
  # is assigned.
  #
  # Currently only false is fully supported.
  eagerStart: false
  # -- Select your cloud provider. Possible values:
  # - K8S      Plain Kubernetes
  # - MINIKUBE Local deployment on Minikube
  cloudProvider: "K8S"
  # -- Whether Theia Cloud shall limit network speed. This might not be fully supported
  # on all cloud provider/in all clusters. Possible values:
  # - K8SANNOTATION                   Set via kubernetes annotations (kubernetes.io/egress-bandwidth and kubernetes.io/ingress-bandwidth)
  # - WONDERSHAPER                    Set via wondershaper init container
  # - K8SANNOTATIONANDWONDERSHAPER    Set Kubernetes annotations and use wondershaper init container
  bandwidthLimiter: "K8SANNOTATION"
  # -- If bandwidthLimiter is set to WONDERSHAPER or K8SANNOTATIONANDWONDERSHAPER this image will be used for the wondershaper init container
  wondershaperImage: theiacloud/theia-cloud-wondershaper:1.2.0-next
  # -- Set the number of active sessions a single user can launch
  sessionsPerUser: "1"
  # -- The name of the storage class for persistent volume claims for workspaces.
  # This storage class must be present on the cluster.
  # Most cloud providers offer a default storage class without additional configuration.
  storageClassName: "default"
  # -- The amount of requested storage for each persistent volume claim (PVC) for workspaces.
  # This is directly passed to created PVCs and must be a valid Kubernetes quantity.
  # See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/
  requestedStorage: "250Mi"
  # -- Number of operator instances to create
  replicas: 1
  # -- Options to influence the operator's leader election
  # @default -- (see details below)
  leaderElection:
    leaseDuration: 6
    renewDeadline: 4
    retryPeriod: 1
  # -- Configures the timeout in milliseconds when a watcher for either AppDefinitions, Workspaces, or Sessions is assumed to be not working.
  # When this is detected the operator instance will stop and a new operator will set up fresh watchers.
  maxWatchIdleTime: "3600000"
  # -- Whether the operator should stop in cases where an exception is not handled
  continueOnException: false
  # -- Build cache configuration
  buildCache:
    # -- Whether to enable build caching
    enabled: false
    # -- The URL of the remote Gradle build cache server.
    gradleUrl: ""
    # -- The URL of the remote Bazel build cache server.
    bazelUrl: ""
    # -- Whether sessions are allowed to push to the build cache.
    enablePush: false
  # -- Dependency cache configuration (Reposilite)
  dependencyCache:
    # -- Whether to enable the dependency cache
    enabled: false
    # -- The URL of the dependency cache server.
    url: ""
  # -- Allows to override the operator's log4j configuration
  # @default -- (see details below)
  logging:
    override: false
    config: |+
      <?xml version="1.0" encoding="UTF-8"?>
      <Configuration status="warn">
        <Appenders>
          <Console name="Console" target="SYSTEM_OUT">
            <PatternLayout
              pattern="%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n" />
          </Console>
        </Appenders>
        <Loggers>
          <Logger name="org.eclipse.theia.cloud.operator" level="info"
            additivity="false">
            <AppenderRef ref="Console" />
          </Logger>
          <Root level="warn">
            <AppenderRef ref="Console" />
          </Root>
        </Loggers>
      </Configuration>

  # -- The version to use of the quay.io/oauth2-proxy/oauth2-proxy image
  oAuth2ProxyVersion: "v7.12.0"
# -- Values of the Theia Cloud REST service
# @default -- (see details below)
service:
  # -- The service authentication token used in the communication between website and REST-API
  # for spam mitigation. This token is public. Please choose a random generated string.
  authToken: asdfghjkl
  # -- The Kubernetes Secret holding the bearer token for admin API token
  # protected endpoints. Set `create: true` and supply `adminApiToken` to have
  # the chart manage it, or leave `create: false` and reference one you created
  # yourself.
  adminApiTokenSecret:
    create: false
    name: service-admin-api-token
    key: ADMIN_API_TOKEN
  # -- Base64-encoded admin API token. Only read when adminApiTokenSecret.create
  # is true. Comes from a deployment secret, never from a file in git.
  adminApiToken: ""
  # -- The image to use. Templated, so the tag follows versions.cloud unless
  # the whole string is overridden.
  image: '{{ .Values.imageRegistry }}/eduide-cloud/service:{{ .Values.versions.cloud }}'
  # -- Optional: Override the imagePullPolicy for the service's docker image.
  # If this is omitted or empty, the root at .Values.imagePullPolicy is used.
  imagePullPolicy:
  # -- Optional: the image pull secret
  imagePullSecret:
  # -- Values related to Sentry on the service.
  # @default -- (see details below)
  sentry:
    # -- Whether to set SENTRY_ENABLE=true in the service deployment.
    enable: true
  # -- service port (default: 8081)
  port: 8081
  # -- protocol of the REST-API
  protocol: https
# -- Gateway API configuration (Envoy Gateway by default)
gateway:
  # -- Master switch for Gateway API resources.
  enabled: true
  # -- Whether to render a Gateway resource in the release namespace.
  # Set to false when using a centralized shared Gateway in another namespace.
  create: true
  routes:
    # -- Whether to render HTTPRoute resources.
    enabled: true
  # -- GatewayClassName to use (Envoy Gateway default is typically "envoy")
  className: "envoy"
  # -- Name of the Gateway resource
  name: "theia-cloud-gateway"
  # -- Optional explicit parentRefs for HTTPRoutes.
  # If empty, routes attach to `gateway.name` in the same namespace.
  #
  # Example for a centralized shared gateway:
  # parentRefs:
  #   - name: theia-shared-gateway
  #     namespace: eduide-system
  parentRefs: []
  # -- HTTPS listener port
  httpsPort: 443
  # -- Whether to create an HTTP listener on port 80 (useful for plain HTTP or external redirects)
  httpEnabled: false
  httpPort: 80
  # -- Does Theia Cloud expect TLS connections (true) or is TLS terminated outside of Theia Cloud (false)
  tls: true
  # -- Name of the HTTPRoute that is updated to publish new Theia application instances
  instancesRouteName: "theia-cloud-demo-ws-route"
  # -- Additional wildcard hostnames and optional dedicated TLS secret names
  # Only accepts wildcard hostnames that are configured in `hosts.allWildcardInstances`.
  instancesWildcardSecretNames: {}
  #  "*.webview.": webview-ws-cert-secret
  # -- HTTPRoute request timeout for service-route (Envoy default can be 15s)
  serviceRouteRequestTimeout: "60s"
operatorrole:
  name: operator-api-access
servicerole:
  name: service-api-access
# -- Values to influence the monitor initialization on the operator
# @default -- (see details below)
monitor:
  # -- Should the monitor be enabled
  enable: true
  # -- Values to influence the activityTracker module
  # @default -- (see details below)
  activityTracker:
    # -- Should the activityTracker module be enabled
    enable: true
    # -- Minutes between re-pinging the pods
    interval: 1
# -- The IDE applications this installation offers.
#
# This map is the single source of truth for three things that used to be
# configured separately and drifted apart: the AppDefinition custom resources,
# the app list the landing page shows, and the set of images preloaded onto
# every node. Adding a language is one entry here, not three edits in two
# repositories.
#
# Each key is the AppDefinition name. `image` is a repository without a tag -
# the tag comes from versions.ide (or the chart's appVersion), so a release
# moves every IDE image at once. An entry with a `landingPage` key is offered in
# the landing page drop-down; one without is deployable but hidden.
# @default -- (see details below)
appDefinitions:
  # -- Applied to every app that does not state its own. Only the four scaling
  # and sizing values genuinely differ between languages.
  defaults:
    uid: 101
    port: 3000
    mountPath: /home/project
    timeout: 1440
    requestsCpu: 200m
    requestsMemory: 500M
    limitsMemory: 2400M
    limitsCpu: "2"
    minInstances: 0
    maxInstances: 1000
    downlinkLimit: 30000
    uplinkLimit: 30000
    imagePullPolicy: IfNotPresent
    options:
      dataBridgeEnabled: "true"
      dataBridgePort: "16281"
  # -- The applications. Key is the AppDefinition name.
  apps:
    java-17-latest:
      image: eduide/java-17
      requestsCpu: 500m
      limitsMemory: 3000M
      # Java is the common case, so some instances are kept warm.
      minInstances: 3
      landingPage:
        label: Java 17
    java-17-templates-latest:
      image: eduide/java-17-templates
      requestsCpu: 500m
      limitsMemory: 3000M
      landingPage:
        label: Java 17 (Templates)
    c-latest:
      image: eduide/c
      landingPage:
        label: C
    c-templates-latest:
      image: eduide/c-templates
      landingPage:
        label: C (Templates)
    javascript-latest:
      image: eduide/javascript
      landingPage:
        label: JavaScript
    ocaml-latest:
      image: eduide/ocaml
      landingPage:
        label: OCaml
    python-latest:
      image: eduide/python
      landingPage:
        label: Python
    rust-latest:
      image: eduide/rust
      landingPage:
        label: Rust

# -- Values to configure preloading of images on Kubernetes nodes.
# @default -- (see details below)
preloading:
  # -- Is image preloading enabled.
  enable: true
  # -- Extra images to preload, on top of the ones derived automatically.
  #
  # Leave this empty. The chart preloads every appDefinitions.apps image, every
  # sidecar image and the landing page image without being told, so the list
  # cannot fall out of step with what the installation actually offers. It used
  # to be written out by hand per environment and addressed by array index,
  # which is how production ended up offering c-templates while preloading
  # everything except c-templates.
  #
  # Each item is either an image reference string or a map:
  # `{ image: "...", args: ["--version"] }` to use the image entrypoint (distroless-friendly),
  # or `{ image: "...", command: [...], args: [...] }` for a full override. If only strings are used,
  # the chart runs `/bin/sh -c 'echo …; exit 0'` (shell required in the image).
  images: []
  # -- Set to false to preload only preloading.images and nothing derived.
  deriveFromApps: true
  # -- Optional: Override the imagePullPolicy for the image preloading containers.
  # If this is omitted or empty, the root at .Values.imagePullPolicy is used.
  imagePullPolicy:

# -- The Gradle build cache and Maven proxy. Optional: nothing reaches it
# unless operator.enableBuildCaching or operator.enableDependencyCaching is also
# turned on, so enabling this alone deploys a cache with no clients.
eduide-shared-cache:
  enabled: false

# -- Reaps workspaces whose sessions are long gone.
theia-workspace-garbage-collector:
  enabled: true
  image:
    # The garbage collector has never been released with a version tag - GHCR
    # holds only `latest`, `main` and per-commit SHAs. Its own chart defaults to
    # `latest`, which would mean a release of this chart installs whatever was
    # built most recently, and `helm upgrade` would see no diff when it changed.
    # Pinned to the commit that `latest` pointed at on 2026-08-25 so a 2.0.0
    # install is reproducible. Replace this with a semver tag once the
    # workspace-garbage-collector repo cuts a release.
    tag: "599557839e5c5893eb0c20785dac671ae70f7e8a"

# -- Skip the check that eduide-cluster is installed on this cluster.
# Only useful for rendering against a cluster that intentionally lacks it.
skipPreflight: false
