# EduIDE umbrella for the Go control plane. One namespace per deployment.
# Hosts, gateway and OIDC settings are stated in the subchart blocks below and checked against each
# other at render time (templates/validate.yaml); keep them in one place with YAML anchors in your
# values file, see deployments/test3/values-test3.yaml.

gateway:
  # Render a Gateway in the release namespace with HTTPS listeners for the service host, the
  # instance host and the fixed webview host (no wildcard, G3) and HTTP :80 listeners for ACME.
  create: true
  # required when create is true
  className: ""
  annotations: {}

# cert-manager reads the Gateway annotations and issues one certificate per HTTPS listener.
certManager:
  # Used when issuer.create is false; with issuer.create the namespaced Issuer below is used.
  issuerRef:
    name: ""
    kind: ClusterIssuer

# Namespaced ACME Issuer for clusters whose ClusterIssuer solves HTTP01 only through a shared
# Gateway. Its solver attaches to THIS Gateway.
issuer:
  create: false
  name: acme
  acme:
    # required when create is true
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ""

# TLS bridge from Envoy to the OIDC provider. Envoy offers only X25519 and P-256 for upstream TLS; the
# TUM Keycloak servers (keycloak.aet.cit.tum.de and keycloak-test) accept only P-384 and P-521, so the
# gateway login fails without it. An nginx in the namespace terminates TLS from Envoy with a self-signed
# certificate (trusted through a BackendTLSPolicy) and talks to the provider with verified TLS. The host is
# taken from eduide-control-plane.config.oidc.issuerURL. Point the control plane at it:
#   eduide-control-plane.oidc.providerBackendRefs: [{name: <release>-oidc-bridge, port: 443}]
# and set authorizationEndpoint, tokenEndpoint and endSessionEndpoint explicitly.
oidcBridge:
  enabled: false
  replicas: 2
  image: nginxinc/nginx-unprivileged:1.29-alpine

# Where the IDE images come from: <registry>/<image>:<tag>.
# An empty tag means the chart appVersion, so a chart release pins the IDE images it was tested with.
images:
  registry: ghcr.io/eduide
  tag: ""

# Applied to every template before its catalog entry and its override.
templateDefaults:
  port: 3000
  # The EduIDE images run as user 101; it also becomes the fsGroup, so workspace volumes are writable.
  runAsUser: 101
  resources:
    requests: {cpu: 200m, memory: 500M}
    limits: {cpu: "2", memory: 2400M}
  timeouts: {idle: 60m, warning: 50m, max: 24h}
  persistence: {allowed: [none, volume], default: none}
  # Accept a GIT_URI with user info: Artemis (Artemis#14702) sends the repository URL with the student's VCS token.
  # The host allowlist still applies; the value reaches only the launch data Secret.
  gitUriAllowCredentials: false
  # Pull policy of the IDE image (Always, IfNotPresent, Never). Not set by default. Set Always when the image tag
  # is reused for new builds (a preview tag such as pr-<N>), otherwise nodes keep their cached image.
  # imagePullPolicy: Always
  env:
  - {name: THEIA, value: "1"}
  # Scorpio reads launch data through the eduide-session extension (the old operator set this per pod).
  - {name: SCORPIO_THEIA_ENV_STRATEGY, value: data-bridge}

# IDE images EduIDE releases. buildSystems feeds the TEMPLATE key.
# listed: whether the landing page offers the template as a start tile. Unlisted templates still start by
# name through the API and Artemis links, so Artemis starts the artemis editions and students pick a standalone one.
catalog:
  java-17:
    displayName: Java 17
    image: eduide/java-17-artemis
    buildSystems: [maven, gradle]
    resources: {requests: {cpu: 500m}, limits: {memory: 3000M}}
    listed: false
  java-25:
    displayName: Java 25
    image: eduide/java-25-artemis
    buildSystems: [maven, gradle]
    resources: {requests: {cpu: 500m}, limits: {memory: 3000M}}
    listed: false
  python:
    displayName: Python
    image: eduide/python-artemis
    buildSystems: [python]
    listed: false
  javascript:
    displayName: JavaScript
    image: eduide/javascript-artemis
    buildSystems: [node, web]
    listed: false
  c:
    displayName: C
    image: eduide/c-artemis
    buildSystems: [make, bazel]
    listed: false
  rust:
    displayName: Rust
    image: eduide/rust-artemis
    buildSystems: [cargo]
    resources: {limits: {memory: 3000M}}
    listed: false
  go:
    displayName: Go
    image: eduide/go-artemis
    buildSystems: [go]
    listed: false
  java-17-standalone:
    displayName: Java 17
    image: eduide/java-17-standalone
    buildSystems: [maven, gradle]
    resources: {requests: {cpu: 500m}, limits: {memory: 3000M}}
  java-25-standalone:
    displayName: Java 25
    image: eduide/java-25-standalone
    buildSystems: [maven, gradle]
    resources: {requests: {cpu: 500m}, limits: {memory: 3000M}}
  python-standalone:
    displayName: Python
    image: eduide/python-standalone
    buildSystems: [python]
  javascript-standalone:
    displayName: JavaScript
    image: eduide/javascript-standalone
    buildSystems: [node, web]
  c-standalone:
    displayName: C
    image: eduide/c-standalone
    buildSystems: [make, bazel]
  rust-standalone:
    displayName: Rust
    image: eduide/rust-standalone
    buildSystems: [cargo]
    resources: {limits: {memory: 3000M}}
  go-standalone:
    displayName: Go
    image: eduide/go-standalone
    buildSystems: [go]

# Templates this deployment offers: catalog name -> overrides (merged over the catalog entry).
# Keys: displayName, image, tag, port, resources, buildSystems, listed, placement, pool {minIdle, maxInstances} (targetIdle is left to the pool scaler).
# An entry without a catalog match needs displayName and image.
templates: {}
# java-17:
#   tag: pr-123
#   pool: {minIdle: 1, maxInstances: 5}

# Values of the subcharts (the required ones are enforced by their schemas).
eduide-control-plane:
  config:
    deployment: ""
    hosts: {service: "", instance: "", webview: ""}
    gateway: {name: "", namespace: "", sectionName: ""}
    oidc: {issuerURL: "", clientIDs: [], gatewayClientID: ""}
  oidc:
    clientSecretName: ""

eduide-landing-page:
  host: ""
  gateway: {name: "", namespace: "", sectionName: ""}
  config:
    title: EduIDE
    keycloak:
      url: https://auth.example.org
      realm: eduide
      clientId: eduide-landing
