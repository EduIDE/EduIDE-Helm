{{- if and .Values.monitoring.enabled .Values.monitoring.alerting.enabled .Values.monitoring.alerting.webhookSecret.create }}
{{- /*
The webhook URLs the channels post to.

A Slack or Discord webhook URL is a credential: anyone holding it can post into
the channel. It never goes in a values file in git and never on a `--set`, which
would put it in the process list and in Actions debug logs. Bootstrap reads it
from a GitHub Environment secret and passes it here already base64-encoded, the
same way the wildcard TLS certificate is handled.

Chart-managed rather than applied alongside, so it is removed when the release
is, and so a channel referring to a key that was never supplied fails the deploy
instead of producing an AlertmanagerConfig that silently notifies nobody.
*/}}
{{- $a := .Values.monitoring.alerting }}
{{- range $i, $c := $a.channels }}
{{- if not (hasKey $a.webhookSecret.data $c.secretKey) }}
{{- fail (printf "channel %q reads key %q from secret %q, but that key was not supplied in monitoring.alerting.webhookSecret.data" $c.name $c.secretKey $a.webhookSecret.name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $a.webhookSecret.name }}
  namespace: {{ $a.namespace }}
  labels:
    app.kubernetes.io/part-of: eduide
data:
  {{- range $k, $v := $a.webhookSecret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
