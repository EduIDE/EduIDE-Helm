              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "maxHeight": 600,
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "How long a student waits between asking for a session and getting one. These are decaying quantiles: with no traffic they hold their last value rather than dropping to zero, so read them alongside the starts per hour panel.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 15
          },
          "id": 115,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (namespace) (application_application_theiacloud_session_startup_seconds_seconds{namespace=~\"$namespace\", quantile=\"0.5\"})",
              "format": "time_series",
              "instant": false,
              "legendFormat": "p50 {{ "{{" }}namespace{{ "}}" }}",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (namespace) (application_application_theiacloud_session_startup_seconds_seconds{namespace=~\"$namespace\", quantile=\"0.95\"})",
              "format": "time_series",
              "instant": false,
              "legendFormat": "p95 {{ "{{" }}namespace{{ "}}" }}",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (namespace) (application_application_theiacloud_session_startup_seconds_seconds{namespace=~\"$namespace\", quantile=\"0.99\"})",
              "format": "time_series",
              "instant": false,
              "legendFormat": "p99 {{ "{{" }}namespace{{ "}}" }}",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Session startup latency",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
