{{- if .Values.monitoring.enabled }}
{{- /*
A PodMonitor naming no namespaces watches nothing, so it is not rendered at all
rather than created as a no-op. The list is derived by bootstrap-cluster.yml
from the environments on the cluster; an empty one means every environment
opted out, which is a supported state. A bare `helm install eduide-cluster`
lands here too, and must not fail.
*/}}
{{- if .Values.monitoring.sessionNamespaces }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: theia-cloud-sessions
  namespace: {{ .Values.monitoring.namespace }}
spec:
  selector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - conversion-webhook
          - landing-page
          - operator
          - service
  namespaceSelector:
    matchNames:
      {{- range .Values.monitoring.sessionNamespaces }}
      - {{ . }}
      {{- end }}
  podMetricsEndpoints:
    - port: application
      interval: 15s
{{- end }}
{{- end }}
