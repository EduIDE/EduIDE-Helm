# Cluster-scoped half of EduIDE 3.0. Installed ONCE per cluster, before any eduide release.
# It carries the control plane CRDs (dependency eduide-control-plane-crds), the cluster
# identity marker and, optionally, the Envoy Gateway GatewayClass and EnvoyProxy and
# cluster alerting. Gateways, certificates and issuers belong to the eduide release.

# -- Name of this cluster. Written to the ConfigMap eduide-system/eduide-cluster-identity
# that the deploy workflows compare against the cluster they think they talk to.
# Empty renders no ConfigMap (the bootstrap workflow can write it with kubectl instead).
clusterName: ""

# -- Set to true to let an install or upgrade proceed on a cluster that still has the
# Theia Cloud CRD appdefinitions.theia.cloud. Removing the Theia CRDs deletes every
# Theia Cloud session and workspace with them, so the chart refuses by default.
allowRemovingTheiaCloud: false

gateway:
  # -- Name of the GatewayClass rendered when `gatewayClass.create` is true.
  className: envoy

gatewayClass:
  create: false
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  labels: {}
  annotations: {}
  # -- Usually points at the EnvoyProxy below, e.g.
  # {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: eduide, namespace: envoy-gateway-system}
  parametersRef: {}

envoyProxy:
  create: false
  name: eduide
  namespace: envoy-gateway-system
  labels: {}
  annotations: {}
  # -- Data plane replica count, rendered into the spec at
  # `provider.kubernetes.envoyDeployment.replicas`. Envoy Gateway stops
  # reconciling that field when the EnvoyProxy leaves it out, which makes a
  # manual scale to zero permanent. A `spec` that names its own replicas wins
  # over this, and `null` leaves the field out. Ignored for a spec that scales
  # some other way (`envoyHpa`, `envoyDaemonSet`, a `Host` provider).
  replicas: 1
  # -- EnvoyProxy spec (hostPort, service type, resources and so on). The chart
  # adds `mergeGateways: true` so all EduIDE deployments share one data plane;
  # set `mergeGateways` here to override.
  spec: {}

# --------------------------------------------------------------------------
# Monitoring for Prometheus Operator stacks (Rancher monitoring and others).
# --------------------------------------------------------------------------
monitoring:
  # -- Create the monitoring resources below. Off by default: it needs the
  # Prometheus Operator CRDs (`monitoring.coreos.com/v1`).
  enabled: false
  # -- Namespace the ServiceMonitor goes in. Must be somewhere your Prometheus
  # discovers. `cattle-monitoring-system` is Rancher's.
  namespace: cattle-monitoring-system
  # -- Namespaces whose certificates the alerts cover, besides the release and
  # alerting namespaces.
  targetNamespaces: []

  # Scrape cert-manager, so certificate expiry can be alerted on.
  #
  # cert-manager exports `certmanager_certificate_expiration_timestamp_seconds`
  # but ships no ServiceMonitor, so by default nothing watches it.
  certManager:
    # -- Create a ServiceMonitor for cert-manager's controller metrics.
    enabled: false
    # -- Namespace cert-manager runs in.
    namespace: cert-manager
    # -- Labels identifying cert-manager's controller Service.
    #
    # A ServiceMonitor selects on Service **labels**; there is no matcher for
    # `metadata.name`. These are the labels cert-manager's own chart sets, and
    # they are values because a release installed under a different name keeps
    # the labels and changes their values. Get them wrong and the ServiceMonitor
    # is created with no targets and reports no error.
    #
    # Check with:
    #   kubectl -n cert-manager get svc cert-manager --show-labels
    selectorLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
    # -- Name of the metrics port on that Service.
    portName: http-metrics

  # Alerting: a PrometheusRule for the certificate alerts plus an AlertmanagerConfig
  # with the channels to notify. It needs `monitoring.enabled` and
  # `monitoring.certManager.enabled`.
  alerting:
    # -- Create the PrometheusRule and the AlertmanagerConfig.
    enabled: false
    # -- Namespace both resources go in.
    #
    # This is also the `namespace` label every EduIDE alert carries, and it is
    # a routing artifact rather than the environment the alert is about. The
    # Prometheus Operator defaults `alertmanagerConfigMatcherStrategy` to
    # `OnNamespace`, which prepends `namespace = <the AlertmanagerConfig's own
    # namespace>` to every route generated from it, so an alert must claim this
    # namespace to reach a receiver at all.
    #
    # The environment an alert is about is in `eduide_namespace`. Silence on
    # that label, never on `namespace` - `namespace` is identical across every
    # EduIDE alert and silencing it silences all of them.
    namespace: eduide-system
    # -- Lowest severity that reaches the notification channels: `warning` or
    # `critical`. Anything below stays in Alertmanager.
    # This is what keeps the channels worth reading.
    minSeverity: warning
    # -- How long to wait for more alerts in a group before the first notification.
    groupWait: 30s
    # -- How long to wait before notifying about new alerts added to a group.
    groupInterval: 5m
    # -- How long before an unresolved alert is sent again.
    repeatInterval: 4h
    # -- Base URL of the operations runbooks, with no trailing slash.
    runbookUrl: https://eduide.github.io/Docs/admins/operations
    # The Secret holding the webhook URLs. Never put a webhook URL in a values
    # file or on a `--set` - it goes in the process list and in Actions debug
    # logs. Bootstrap writes this Secret from GitHub Environment secrets.
    webhookSecret:
      # -- Create the Secret from `data` below. Off means the Secret already
      # exists and is referenced by name only.
      create: false
      # -- Name of the Secret channels read their URL from.
      name: eduide-alert-webhooks
      # -- Base64-encoded webhook URLs, keyed by the `secretKey` a channel
      # names. Supplied by the workflow, not committed.
      data: {}
    # -- Where to send alerts. Each entry needs `name`, `type` (`slack` or
    # `discord`) and `secretKey`; Slack entries may also set `channel`. An
    # empty list with alerting enabled means alerts fire but notify nobody, so
    # the chart fails the render instead.
    #
    # A channel may set `environments: [ns, ...]` to receive only that
    # installation's alerts. One cluster can host installations belonging to
    # different people - Bonn and Mannheim share a cluster and each has its own
    # Discord - and without scoping, both would see the other's incidents.
    #
    # Anything no scoped channel claims goes to **every** channel. That is how
    # cluster-scoped alerts still get out: a certificate expiring is not
    # about any one installation's namespace, and
    # dropping it for failing to match an installation route would lose exactly the
    # alerts that matter most.
    #
    #   channels:
    #     - name: mannheim
    #       type: discord
    #       secretKey: discord-mannheim
    #       environments: [eduide-mannheim]
    #     - name: platform
    #       type: slack
    #       secretKey: slack-platform
    #       channel: "#eduide-alerts"
    channels: []
    # Thresholds, so tuning noise down does not need a chart release.
    thresholds:
      # -- Days before certificate expiry to start warning.
      certExpiryDays: 21
