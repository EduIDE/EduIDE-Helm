# Cluster-scoped half of EduIDE. Installed ONCE per cluster.
#
# The tenant chart (eduide) is installed once per environment and owns
# nothing in here. Splitting them is what removes the race where three
# concurrent tenant deploys all reinstalled the same cluster-scoped
# objects into the default namespace.

issuerca:
  # -- whether to install the CA certificate signer
  enable: true
  # -- name for the issuer preparing a self signed CA certificate
  name: theia-cloud-ca-certificate-signer

issuerprod:
  # -- whether to install the let's encrypt production cluster issuer
  enable: false
  # -- name for the let's encrypt production cluster issuer
  name: letsencrypt-prod
  # -- ACME solver list for cert-manager (required when `issuerprod.enable=true`)
  solvers: []

issuerstaging:
  # -- name for the self signed cluster issuer
  name: theia-cloud-selfsigned-issuer

issuer:
  # -- email used to issue let's encrypt certificates
  email: mmorlock@example.com

operatorrole:
  # -- name for the operator's cluster role
  name: operator-api-access

servicerole:
  # -- name for the services' cluster role
  name: service-api-access

certmanager:
  # -- the namespace where the cert-manager is installed
  namespace: cert-manager

# --- CRDs and the conversion webhook ---
conversion:
  # -- The image of the webhook container
  image: theiacloud/theia-cloud-conversion-webhook:1.2.0-next
  # -- The location of where the certificates are mounted into the container (needs to match with application.properties)
  certMountPath: /etc/webhook/certs
  # -- The certificate reload period in seconds
  certReloadPeriod: 604800

# -- The cluster issuer to use for the certificate
clusterIssuer: theia-cloud-selfsigned-issuer

# --------------------------------------------------------------------------
# The shared Gateway. One per cluster, one listener set per environment.
#
# This was a chart of its own in EduIDE-deployment until 2.0.0. It belongs here:
# a Gateway is cluster-scoped, and keeping chart source in the deployment repo
# meant the cluster half of an install was not versioned with the rest.
#
# At TUM `gateway.listeners` is generated by the Bootstrap cluster workflow from
# the environment manifests. Installing by hand, you write it - see the worked
# example below.
# --------------------------------------------------------------------------
gateway:
  # -- Create the shared Gateway. Set false only if you terminate and route
  # traffic some other way; EduIDE then has no ingress of its own.
  create: true
  name: theia-shared-gateway
  namespace: eduide-system
  className: envoy
  labels: {}
  annotations: {}
  addresses: []
  allowedRoutes:
    namespaces:
      from: All
  # -- The Gateway's listeners. **Required.** With none, no Gateway is created
  # and nothing routes.
  #
  # Every environment contributes four, named `<prefix>-landing`,
  # `<prefix>-service`, `<prefix>-instances` and `<prefix>-webview`. Those names
  # are load-bearing: each must match a `gateway.parentRefs[].sectionName` in
  # that environment's values for the `eduide` chart, or its routes attach to
  # nothing. The prefix is yours to choose and must be unique on the cluster.
  #
  # A certificate that does not cover a listener's hostname is NOT detected -
  # the Gateway reports Programmed=True and browsers reject it. See
  # `managedCertificates` below, and note the webview listener needs a WILDCARD
  # certificate that ACME HTTP-01 cannot issue.
  #
  # For one environment at eduide.example.edu:
  #
  # listeners:
  #   - name: prod-landing
  #     hostname: eduide.example.edu
  #     tlsSecretName: eduide-tls
  #   - name: prod-service
  #     hostname: service.eduide.example.edu
  #     tlsSecretName: eduide-tls
  #   - name: prod-instances
  #     hostname: instance.eduide.example.edu
  #     tlsSecretName: eduide-tls
  #   - name: prod-webview
  #     hostname: "*.webview.instance.eduide.example.edu"
  #     tlsSecretName: eduide-webview-tls
  #
  # Each entry takes `name`, `hostname` and `tlsSecretName`, plus optionally
  # `protocol` (HTTPS by default, HTTP for an ACME challenge listener), `port`
  # and `allowedRoutes`.
  listeners: []
  # -- Permanent redirects from hostnames this cluster used to serve.
  #
  # Each entry needs a listener of the same `name` on the Gateway - which
  # `bootstrap-cluster.yml` emits from `spec.redirects` in the cluster manifest -
  # and renders an HTTPRoute that 301s `from` to `to`, keeping the path and the
  # query string.
  #
  # redirects:
  #   - name: legacy-landing
  #     from: theia.example.edu
  #     to: eduide.example.edu
  redirects: []
gatewayClass:
  create: false
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  labels: {}
  annotations: {}
  parametersRef: {}
envoyProxy:
  create: false
  name: theia-shared-gateway
  namespace: envoy-gateway-system
  labels: {}
  annotations: {}
  spec: {}
managedCertificates:
  enabled: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  # -- Each entry takes either `hostname` (one name) or `dnsNames` (a list).
  # `bootstrap-cluster.yml` fills this in from the environments on the cluster,
  # so a new environment gets its certificate names without a second edit -
  # which is how test3 ran for 184 days on a certificate that only covered
  # test1, test2 and staging.
  certificates: []
gatewayAcmeIssuer:
  # -- Override the ACME solvers entirely. Leave empty for the built-in HTTP-01
  # solver, which is enough for every hostname EXCEPT the webview wildcard.
  #
  # ACME cannot issue a wildcard over HTTP-01. If you want cert-manager to issue
  # `*.webview.instance.<host>` you need DNS-01, which means an API credential
  # for your DNS zone. For example:
  #
  # solvers:
  #   - dns01:
  #       cloudflare:
  #         apiTokenSecretRef: { name: cloudflare-api-token, key: token }
  #     selector:
  #       dnsNames: ["*.webview.instance.eduide.example.edu"]
  #   - http01:
  #       gatewayHTTPRoute:
  #         parentRefs:
  #           - { group: gateway.networking.k8s.io, kind: Gateway, name: theia-shared-gateway, namespace: eduide-system }
  #
  # If you cannot get a DNS-01 credential, obtain the wildcard some other way
  # and supply it through `wildcardTLSSecret` below.
  solvers: []
  enabled: false
  name: letsencrypt-prod-gateway
  email: ''
  privateKeySecretName: letsencrypt-prod-gateway-priv-key
  server: https://acme-v02.api.letsencrypt.org/directory
  serviceType: ClusterIP
wildcardTLSSecret:
  create: false
  name: static-theia-cert
  namespace: eduide-system
  certificate: ''
  key: ''

# --------------------------------------------------------------------------
# PodMonitors and Grafana dashboards for Rancher's monitoring stack.
#
# Cluster-scoped like the Gateway: the PodMonitors live in Rancher's namespace
# and name every namespace they watch. That list was hand-written and had gone
# stale - it still named `theia` and `theia-staging`, which no longer exist.
# Bootstrap derives it from the environments on this cluster instead.
# --------------------------------------------------------------------------
monitoring:
  # -- Create the PodMonitors and Grafana dashboards.
  #
  # Off by default because it is not portable: it needs the Prometheus Operator
  # CRDs (`monitoring.coreos.com/v1`) to exist, and the two namespaces below are
  # Rancher's. Helm does not create namespaces it was not told to, so on a
  # cluster without them the install fails outright on the dashboards.
  #
  # Turn it on once you know where your Prometheus and Grafana look for these.
  enabled: false
  # -- Namespace the PodMonitors go in. Must be somewhere your Prometheus
  # discovers. `cattle-monitoring-system` is Rancher's; change it for any other
  # monitoring stack.
  namespace: cattle-monitoring-system
  # -- Namespace the Grafana dashboard ConfigMaps go in. Must already exist and
  # be watched by Grafana's sidecar. `cattle-dashboards` is Rancher's.
  dashboardNamespace: cattle-dashboards
  targetNamespaces: []
  sessionNamespaces: []
